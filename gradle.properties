# The single version of every artifact: core, CLI, JetBrains plugin, VS Code extension and Claude plugin.
aiCommentsVersion=0.2.0

# The IDE the JetBrains plugin compiles, tests and verifies against; downloaded on first build.
platformVersion=2026.2.3

org.gradle.jvmargs=-Xmx3g -XX:+UseParallelGC
org.gradle.caching=true
kotlin.native.ignoreDisabledTargets=true

# One JS file for the VS Code extension to import, instead of one per Kotlin module.
kotlin.js.ir.output.granularity=whole-program
